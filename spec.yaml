schemaVersion: "2"
kind: mixin
name: sonar-vortex
displayName: Sonar Vortex
description: >-
  Adds Sonar Vortex to a Claude Code sandbox. Installs the SonarQube CLI and runs
  `sonar integrate claude` to wire the SonarQube MCP Server, secrets-scanning
  hooks, and Vortex context so the agent gets repository-aware context (coding
  guidelines, dependency health, architecture, semantic navigation) before it
  writes code, then verifies every change in real time against your SonarQube
  Cloud quality profiles and rules with the same algorithmic analysis engine used
  in production. Your SonarQube token is proxy-injected and never enters the
  container.
licenses:
  - Apache-2.0

# Sonar Vortex's flagship integration is Claude Code (`sonar integrate claude`),
# so this kit targets the `claude` base agent. (The SonarQube CLI can also
# integrate copilot/codex/cursor/gemini, but each writes a different agent config
# — out of scope for this kit.)
requires:
  agent: claude

# Sonar Vortex connects to SonarQube Cloud. Region + organization are the only
# per-user inputs. Because substitution happens before the spec is decoded, `url`
# parameterizes SONARQUBE_CLI_SERVER and the network allowlist together, so the
# EU (sonarcloud.io) and US (sonarqube.us) regions both work without editing the
# spec. The token is never an arg — it is a proxy-injected credential (below).
args:
  url:
    default: "https://sonarcloud.io"
    description: >-
      SonarQube Cloud base URL. EU: https://sonarcloud.io (default).
      US: https://sonarqube.us. (SonarQube Server URLs also work but are
      untested by this kit.)
    pattern: '^https://[a-z0-9.-]+\.[a-z]{2,}$'
  org:
    default: ""
    description: >-
      Your SonarQube Cloud organization key (Organization → Administration →
      Organization key). Required for Vortex; leave empty only to configure it
      later inside the sandbox.
    pattern: '^[A-Za-z0-9._-]*$'
  project:
    default: ""
    description: >-
      Optional SonarQube project key. When set, `sonar integrate claude` scopes
      to this project (it must already have been analyzed on a long-lived branch
      in SonarQube Cloud). Leave empty to select per-call.
    pattern: '^[A-Za-z0-9._:-]*$'

# The SonarQube USER token. The SonarQube CLI reads it from SONARQUBE_CLI_TOKEN
# for headless (env-var) auth, alongside SONARQUBE_CLI_SERVER + SONARQUBE_CLI_ORG.
# It is sentinel-swapped by the proxy: the container only ever sees
# SONARQUBE_CLI_TOKEN == a proxy placeholder, and the proxy substitutes the real
# token into the `Authorization: Bearer <token>` header on outbound calls to
# SonarQube Cloud. The CLI runs natively in the sandbox, trusts the sbx proxy CA,
# and honors HTTPS_PROXY, so the swap happens transparently.
#
# The token injects on BOTH the EU and US API hosts; whichever region the CLI
# actually calls gets the swap, the other rule is simply unused. Injection is
# keyed by (domain, header), so nothing is crossed.
#
# NOTE: connected mode requires a USER token — project, global, or scoped
# organization tokens will not bind correctly.
credentials:
  - service: sonarqube
    description: "SonarQube Cloud USER token (sent as Authorization: Bearer)."
    required: true
    apiKey:
      name: SONARQUBE_CLI_TOKEN
      inject:
        - domain: "sonarcloud.io"
          scheme: bearer
        - domain: "api.sonarcloud.io"
          scheme: bearer
        - domain: "sonarqube.us"
          scheme: bearer
        - domain: "api.sonarqube.us"
          scheme: bearer

permissions:
  network:
    allow:
      # SonarQube Cloud EU (sonarcloud.io) + US (sonarqube.us) web + API hosts.
      # Cover the bare host, the api. subdomain, and one-label siblings (scanner.,
      # etc.). Must be a superset of the credential inject domains above.
      - "sonarcloud.io"
      - "api.sonarcloud.io"
      - "*.sonarcloud.io"
      - "sonarqube.us"
      - "api.sonarqube.us"
      - "*.sonarqube.us"
      # SonarQube CLI installer + the CLI binary / analyzer artifacts it downloads.
      - "raw.githubusercontent.com"
      - "github.com"
      - "objects.githubusercontent.com"
      - "binaries.sonarsource.com"

environment:
  variables:
    # Headless auth config for the SonarQube CLI (SONARQUBE_CLI_TOKEN is the
    # proxy-injected credential above). SERVER selects the region.
    SONARQUBE_CLI_SERVER: "${{ kit.args.url }}"
    SONARQUBE_CLI_ORG: "${{ kit.args.org }}"
    # The SonarQube MCP Server (configured by `sonar integrate claude`) reads
    # these; harmless when unused.
    SONARQUBE_URL: "${{ kit.args.url }}"
    SONARQUBE_ORG: "${{ kit.args.org }}"
    # Optional project scope, read by `sonar integrate` and the Vortex context.
    SONAR_PROJECT_KEY: "${{ kit.args.project }}"

setup:
  install:
    # 1. Install the SonarQube CLI (`sonar`). Native binary -> lands in
    #    ~/.local/share/sonarqube-cli/bin. Idempotent: skip if already present.
    - command: |
        if [ -x "$HOME/.local/share/sonarqube-cli/bin/sonar" ]; then
          echo "sonar-vortex: SonarQube CLI already installed"
        else
          curl -fsSL https://raw.githubusercontent.com/SonarSource/sonarqube-cli/refs/heads/master/user-scripts/install.sh | bash \
            || echo "sonar-vortex: SonarQube CLI install failed (check network allowlist / region)"
        fi
      user: "1000"
      description: Install the SonarQube CLI (sonar)
    # 2. Symlink the binary into ~/.local/bin, which is already on PATH for every
    #    shell AND for non-login `sbx exec`. (The installer only appends PATH to
    #    ~/.bashrc, which sh/dash and non-interactive execs don't read.) Also add
    #    an rc export as a bonus for interactive shells.
    - command: |
        SRC="$HOME/.local/share/sonarqube-cli/bin/sonar"
        if [ -x "$SRC" ]; then
          mkdir -p "$HOME/.local/bin" && ln -sf "$SRC" "$HOME/.local/bin/sonar"
          for rc in "$HOME/.bashrc" "$HOME/.profile" "$HOME/.zshrc"; do
            [ -e "$rc" ] || : > "$rc"
            grep -q 'sonarqube-cli/bin' "$rc" 2>/dev/null && continue
            printf '\n# sonar-vortex: SonarQube CLI on PATH\nexport PATH="%s:$HOME/.local/bin:$PATH"\n' \
              "$HOME/.local/share/sonarqube-cli/bin" >> "$rc"
          done
          echo "sonar-vortex: linked sonar into ~/.local/bin"
        else
          echo "sonar-vortex: sonar binary missing; skipping PATH wiring"
        fi
      user: "1000"
      description: Put the SonarQube CLI on PATH for all shells
    # 3. Disable CLI telemetry so the sandbox doesn't attempt (denied) egress to
    #    events.sonardata.io. Best-effort.
    - command: |
        "$HOME/.local/bin/sonar" config telemetry --disabled >/dev/null 2>&1 \
          && echo "sonar-vortex: CLI telemetry disabled" \
          || echo "sonar-vortex: could not disable telemetry (non-fatal)"
      user: "1000"
      description: Disable SonarQube CLI telemetry
  startup:
    # Wire Vortex + the SonarQube MCP Server + secrets hooks into Claude Code via
    # `sonar integrate claude`. This needs a valid, proxy-injected token; it is
    # best-effort and never blocks boot. If the token isn't bound/valid yet, the
    # agent can re-run the command from a shell (see agentInstructions).
    - command:
        - "sh"
        - "-lc"
        - |
          export PATH="$HOME/.local/bin:$HOME/.local/share/sonarqube-cli/bin:$PATH"
          if command -v sonar >/dev/null 2>&1; then
            if sonar integrate claude --global --non-interactive >/dev/null 2>&1; then
              echo "sonar-vortex: Vortex + MCP integration ready"
            else
              echo "sonar-vortex: run 'sonar integrate claude --non-interactive' once a valid SonarQube token is bound"
            fi
          fi
      user: "1000"
      background: false
      description: Wire Sonar Vortex + MCP into Claude Code (sonar integrate claude)

agentInstructions:
  content: |
    # Sonar Vortex

    This sandbox has the **SonarQube CLI** (`sonar`) installed and, on start,
    runs `sonar integrate claude` to wire **Sonar Vortex** — the SonarQube MCP
    Server, secrets-scanning hooks, and repository-aware context. Use it to write
    higher-quality, more secure code with fewer tokens and less rework.

    ## First, make sure Vortex is wired

    If the `sonarqube` MCP tools or `sonar context` aren't available yet (e.g. the
    token was bound after boot), run once:

    ```bash
    sonar integrate claude --non-interactive        # add --project <key> to scope it
    ```

    Verify with `sonar auth status` (should show **Connected**) and
    `sonar context` (should list available context, not "not installed").

    ## Already configured

    - **Credentials**: `SONARQUBE_CLI_TOKEN` is a proxy placeholder inside the
      container, never the real token. Do **not** read or print it — the sbx proxy
      swaps in the real value on the `Authorization: Bearer` header for outbound
      calls to SonarQube Cloud (`$SONARQUBE_CLI_SERVER`). It never exists in the
      container.
    - **Environment**: `SONARQUBE_CLI_SERVER` (region), `SONARQUBE_CLI_ORG`
      (organization), and `SONAR_PROJECT_KEY` (optional) are exported.
    - **CLI on PATH**: `sonar` is linked into `~/.local/bin`.
    - **Network**: egress is allowed to SonarQube Cloud (`sonarcloud.io` /
      `sonarqube.us` + `api.*`) and the CLI/analyzer download hosts.

    ## The Vortex loop

    1. **Before writing code**, pull project context — use the `sonarqube` MCP
       tools, or `sonar context` — for coding guidelines, third-party dependency
       health (before adding/bumping a package), architecture constraints, and
       semantic navigation. This front-loads the right constraints so you generate
       compliant code on the first pass.
    2. **After each change**, verify from the terminal:

       ```bash
       sonar analyze agentic        # server-side Vortex analysis of the change
       sonar analyze secrets        # scan the diff/files for hardcoded secrets
       sonar quality-gate status    # is the project still passing its gate?
       sonar list issues            # issues Sonar found, to fix before finishing
       ```

    3. **Fix what Sonar reports** and re-run until analysis is clean and the
       quality gate passes. Treat a failing quality gate or a new blocker/critical
       issue as a task that is not yet done.

    Prefer resolving Sonar findings over ignoring them. If a rule genuinely does
    not apply, note why rather than suppressing it silently.

    An operational runbook is in `~/runbooks/sonar-vortex.md`. Docs:
    https://www.sonarsource.com/products/sonar-vortex/
