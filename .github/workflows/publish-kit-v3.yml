name: Publish kit (v3)

# v3 counterpart to publish-kit.yml (which publishes the repo-root v2 spec.yaml
# with `sbx kit push`). The v3 kit under v3/sonar-vortex is an ordinary OCI image
# built with docker buildx: the kit frontend (pulled from the descriptor's
# `# syntax=docker/sandbox-kit:3` line) validates the descriptor during the
# build, so the validate job needs no extra tooling and runs on plain Linux.
#
# Both v2 and v3 kits stay published: a v3 mixin only composes onto v3 workloads,
# a v2 mixin only onto v2 agents. The v3 kit publishes under its OWN image name
# (sonar-vortex-kit-v3), distinct from the v2 sonar-vortex-kit, so there is no
# :latest collision — this workflow publishes on push to main (like the v2
# publish-kit.yml) and on manual dispatch with a custom tag.

on:
  pull_request:
    paths:
      - "v3/**"
      - "scripts/push-kit-v3.sh"
      - ".github/workflows/publish-kit-v3.yml"
  push:
    branches: [main]
    paths:
      - "v3/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag to publish (always also pushes :<tag>-<version>)"
        required: false
        default: "latest"

jobs:
  # Build the kit. The kit frontend validates the descriptor as part of the
  # build, so a bad field fails here. No push — PRs and pushes to main only prove
  # the kit builds.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validate) the v3 kit
        run: PUSH=0 bash ./scripts/push-kit-v3.sh

  # Push to Docker Hub on push to main (tag "latest") or manual dispatch (custom
  # tag). Not on pull_request — PRs only validate via the build job above.
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the v3 kit
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        # inputs.tag is empty on push events; fall back to "latest".
        run: PUSH=1 bash ./scripts/push-kit-v3.sh "${{ github.event.inputs.tag || 'latest' }}"
